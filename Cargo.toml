[package]
name = "docx-lite"
version = "0.1.0"
edition = "2021"
authors = ["V-Lawyer Team"]
license = "MIT OR Apache-2.0"
description = "Lightweight, fast DOCX text extraction library with minimal dependencies"
repository = "https://github.com/v-lawyer/docx-lite"
documentation = "https://docs.rs/docx-lite"
readme = "README.md"
keywords = ["docx", "office", "word", "text-extraction", "parser"]
categories = ["parsing", "text-processing"]

[dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
